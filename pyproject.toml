[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meapp"
version = "0.1.0"
description = "Maintenance Email Application"
requires-python = ">=3.14"

dependencies = [
    "python-dotenv",
    "requests",
    "xlwings",
    "beautifulsoup4",
    "lxml",
    "word2number",
    "dateparser",
    "rapidfuzz",
]

[project.scripts]
meapp = "meapp.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]